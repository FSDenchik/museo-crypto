services:
  museo-de-crypto:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: museo-de-crypto
    ports:
      - "8080:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123}
      DATABASE_PATH: /app/data/analytics.sqlite3
    volumes:
      - museo-data:/app/data
    restart: unless-stopped

volumes:
  museo-data:

